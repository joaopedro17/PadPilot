[workspace]
resolver = "3"
members = ["crates/core", "crates/logging", "crates/app", "crates/watchdog", "crates/settings", "crates/icon"]

[workspace.package]
version = "0.8.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
padpilot-core = { path = "crates/core" }
padpilot-logging = { path = "crates/logging" }
tracing = "0.1"
