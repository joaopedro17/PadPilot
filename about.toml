# cargo-about: lists the licenses of the crates built into the executables,
# for THIRD-PARTY-LICENSES.md in each release zip.
# egui embeds fonts (OFL-1.1, Ubuntu-font-1.0) in the settings window.
accepted = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "Zlib", "ISC", "OFL-1.1", "Ubuntu-font-1.0"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Only the platform the release is built for.
targets = ["x86_64-pc-windows-msvc"]
