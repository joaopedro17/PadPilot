name: CI

# develop is where work is merged; main only receives releases.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Required status check "Linux": formatting, lints, logic tests.
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The three Windows jobs each compile everything in their own way (check,
  # debug, release), so they run side by side instead of one after another.
  windows-clippy:
    name: Windows clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  windows-test:
    name: Windows test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: PadPilot-windows-x64
          path: |
            target/release/padpilot.exe
            target/release/padpilot-watchdog.exe
            target/release/padpilot-settings.exe

  windows:
    # Required status check "Windows": passes only when all three Windows jobs
    # passed. It runs even when one failed, because a skipped check would count
    # as passing.
    name: Windows
    needs: [windows-clippy, windows-test, windows-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Windows jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
