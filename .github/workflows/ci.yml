name: CI

# develop is where work is merged; main only receives releases.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Nothing by default; each job asks for what it needs. Actions are pinned
# to commits, not tags: a tag can be moved to other code.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Required status check "Linux": formatting, lints, logic tests.
    name: Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # rustup installs the version in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  # The three Windows jobs each compile everything in their own way (check,
  # debug, release), so they run side by side instead of one after another.
  windows-clippy:
    name: Windows clippy
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # rustup installs the version in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  windows-test:
    name: Windows test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # rustup installs the version in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  windows-build:
    name: Windows build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # rustup installs the version in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --locked --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PadPilot-windows-x64
          path: |
            target/release/padpilot.exe
            target/release/padpilot-watchdog.exe
            target/release/padpilot-settings.exe

  windows:
    # Required status check "Windows": passes only when all three Windows jobs
    # passed. It runs even when one failed, because a skipped check would count
    # as passing.
    name: Windows
    needs: [windows-clippy, windows-test, windows-build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: All Windows jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
