# Publishing a release on GitHub (tag vX.Y.Z on main, notes written there)
# builds PadPilot on Windows and attaches the zip and its checksum to it.
name: Release

on:
  release:
    types: [published]

# Nothing by default; each job asks for what it needs. Actions are pinned
# to commits, not tags: a tag can be moved to other code.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
      # Releases come from main; a tag on another branch gets no files.
      - name: The tagged commit is on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "${{ github.event.release.tag_name }} is not on main" }
      - name: The version in Cargo.toml matches the tag
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.event.release.tag_name }}") {
            throw "Cargo.toml says $version but the tag is ${{ github.event.release.tag_name }}"
          }
      # rustup installs the version in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release
      - name: Package
        shell: pwsh
        run: |
          $name = "PadPilot-" + "${{ github.event.release.tag_name }}".TrimStart('v')
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item target/release/padpilot.exe, target/release/padpilot-watchdog.exe,
            target/release/padpilot-settings.exe, README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name-windows-x64.zip"
          $hash = (Get-FileHash "dist/$name-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name-windows-x64.zip" | Out-File -Encoding ascii "dist/$name-windows-x64.zip.sha256"
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist -File).FullName --clobber
